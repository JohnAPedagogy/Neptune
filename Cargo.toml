[package]
name = "neptune"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A pedagogical, Three.js-inspired 3D graphics engine in Rust on top of Vulkano"
repository = "https://github.com/johnalamina/Neptune"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.30.10", features = ["bytemuck"] }
image = "0.25.10"
vulkano = "0.35.2"
vulkano-shaders = "0.35.0"
winit = "0.30.13"

[dev-dependencies]
rand = "0.8"

# Cargo examples default to `test = false`, which would leave the flappy_bird
# example's game-logic tests (gravity, collision, scoring, recycling, restart)
# running only under an explicit `cargo test --example flappy_bird`. Opting in
# folds them into plain `cargo test`.
[[example]]
name = "flappy_bird"
test = true

[[example]]
name = "hello_cube"

[[example]]
name = "hello_sprite"

[[example]]
name = "orbit_cube"

[[example]]
name = "ui_demo"
