# shaderc-sys (pulled in by vulkano-shaders) compiles shaderc's C++ sources
# from scratch on first build. shaderc's bundled CMakeLists.txt requires an old
# `cmake_minimum_required` that current CMake refuses to configure without an
# explicit policy floor (see hardparts/arch/workshop01_vulkano_triangle.md §6a
# for the full story).
#
# This applies automatically whenever cargo is invoked with CWD inside this
# repo (Cargo's config discovery is CWD-based, not --manifest-path-based) --
# unlike persistent user-level env vars, which subagent/CI shells don't
# reliably inherit.
#
# Note for Windows/MSVC: building this repo from a deeply nested path, on top
# of shaderc's own deeply nested C++ source tree, can trip an obscure `cl.exe`
# long-path failure. If you hit it, point `CARGO_TARGET_DIR` at a short path
# (e.g. `C:\rust-target`) in your own environment -- that is a machine-local
# choice and deliberately not committed here.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
